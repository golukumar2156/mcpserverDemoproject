spring.application.name=mutiModelExample
server.port=8080

# Groq (OpenAI-compatible). Key ko environment variable se lo, file me mat likho.

spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=qwen/qwen3.8-27b

# MCP server (taskServer, port 8081)
spring.ai.mcp.client.streamable-http.connections.task-server.url=http://localhost:8081
spring.ai.mcp.client.streamable-http.connections.task-server.endpoint=/mcp